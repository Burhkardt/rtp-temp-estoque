security:
  - Bearer: []
tags:
  - BarcodeImage
consumes:
  - multipart/form-data
parameters:
  - name: barcode_image
    in: formData
    type: file
    required: true
    description: Imagem contendo código(s) de barras
responses:
  200:
    description: Códigos extraídos com sucesso
    schema:
      type: object
      properties:
        status:
          type: string
        codigos:
          type: array
          items:
            type: string
  400:
    description: Arquivo não enviado ou inválido
  422:
    description: Nenhum código de barras válido detectado
